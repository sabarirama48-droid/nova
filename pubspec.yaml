name: nova
description: "NOVA - Your Personal AI Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  animate_do: ^3.3.4
  flutter_animate: ^4.5.0

  google_generative_ai: ^0.4.6
  http: ^1.2.1

  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  flutter_secure_storage: ^9.0.0

  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9+1
  battery_plus: ^6.0.1
  geolocator: ^12.0.0
  device_info_plus: ^10.1.0

  flutter_local_notifications: ^17.2.2

  connectivity_plus: ^6.0.3

  url_launcher: ^6.2.5

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
